name: Diagnose VIP direct auction links
on:
  push:
    paths:
      - '.github/workflows/diagnose-vip.yml'
      - 'scripts/probe_vip_direct.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python scripts/probe_vip_direct.py
