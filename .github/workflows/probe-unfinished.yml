name: Diagnose unresolved source DOM
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/probe-unfinished.yml'
permissions:
  contents: write
jobs:
  inspect:
    if: "github.event.head_commit.message == 'ci: diagnose unfinished sources'"
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Examine public catalogs (no authentication)
        run: python scripts/probe_unfinished_sources.py
      - name: Store diagnostics exclusively on develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/platform-dom-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "data: public DOM diagnostics for unfinished source adapters"
            git push origin HEAD:develop
          fi
