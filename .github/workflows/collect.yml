name: Collect verified auctions
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10,16 * * *"
permissions:
  contents: write
concurrency:
  group: auction-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q scripts app tests
      - name: Install browser diagnostics
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check official sources
        run: python scripts/collect.py
      - name: Diagnose big auction platforms
        continue-on-error: true
        run: python scripts/browser_probe.py
      - name: Discover new auction leads
        run: python scripts/discover.py
      - name: Publish verified feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/events.json app/collection-report.json app/discovery-candidates.json
          if [ -f app/browser-diagnostics.json ]; then git add app/browser-diagnostics.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified auction feed"
            git push
          fi
