name: Collect verified auctions
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10,16 * * *"
permissions:
  contents: write
concurrency:
  group: auction-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m compileall -q scripts app tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install browser diagnostics
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check official sources
        run: python scripts/collect.py
      - name: Validate verified auction feed
        run: python scripts/validate_feed.py
      - name: Build standalone public page from validated feed
        run: python scripts/build_static_page.py
      - name: Publish verified feed first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/events.json app/collection-report.json app/source-health.json app/index.html
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified auction feed"
            git push
          fi
      # Discovery is experimental. A failure must not block publishing the
      # independently validated event feed above.
      - name: Diagnose big auction platforms
        continue-on-error: true
        run: python scripts/browser_probe.py
      - name: Discover new auction leads
        continue-on-error: true
        run: python scripts/discover.py
      - name: Discover official PNCP auction notices
        continue-on-error: true
        run: python scripts/discover_pncp.py
      - name: Discover official regional auction portals
        continue-on-error: true
        run: python scripts/portal_watch.py
      - name: Prioritize unverified discovery leads
        continue-on-error: true
        run: python scripts/prioritize_leads.py
      - name: Audit source coverage and discovery gaps
        if: always()
        continue-on-error: true
        run: python scripts/coverage_audit.py
      - name: Publish optional research diagnostics
        run: |
          for file in \
            app/discovery-candidates.json \
            app/review-queue.json \
            app/pncp-candidates.json \
            app/browser-diagnostics.json \
            app/vip-dom-diagnostics.json \
            app/portal-candidates.json \
            app/coverage-audit.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh auction research leads and diagnostics"
            git push
          fi
      - name: Summarize MVP collection results
        if: always()
        run: python scripts/mvp_run_summary.py
      - name: Record P0.2 collection history
        run: |
          python scripts/record_collection_history.py
          git add app/collection-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record MVP collection stability checkpoint"
            git push
          fi
