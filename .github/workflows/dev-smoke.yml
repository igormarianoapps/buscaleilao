name: Smoke development preview
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/dev-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    if: "github.event.head_commit.message == 'ci: smoke development preview'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for live end-to-end checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test deployed develop site, filters, safe links, sixteen sources and mobile
        env:
          PUBLIC_URL: https://buscaleilao-dev.vercel.app/
        run: python tests/smoke_preview.py
