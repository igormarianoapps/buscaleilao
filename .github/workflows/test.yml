name: Test auction adapters
on:
  push:
    paths:
      - 'scripts/**'
      - 'app/agenda.mjs'
      - 'app/index.html'
      - 'app/index.template.html'
      - 'app/sources.json'
      - 'tests/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/collect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/agenda.test.mjs
      - run: python -m compileall -q scripts app tests
      - run: python -m unittest discover -s tests -v
