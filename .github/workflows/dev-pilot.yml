name: Development collection pilot
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/dev-pilot.yml'
permissions:
  contents: write
concurrency:
  group: buscaleilao-development-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: "github.event.head_commit.message == 'ci: run one-time development collector pilot'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code before network collection
        run: |
          python -m compileall -q scripts app tests
          node --test tests/agenda.test.mjs
          python -m unittest discover -s tests -v
      - name: Install Playwright for verified platform collection
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Collect real source listings into development only
        run: python scripts/collect.py
      - name: Validate every published development event
        run: python scripts/validate_feed.py
      - name: Discover regional official auction leads
        continue-on-error: true
        run: python scripts/portal_watch.py
      - name: Discover national research leads
        continue-on-error: true
        run: |
          python scripts/discover.py
          python scripts/discover_pncp.py
      - name: Prioritize official review queue
        continue-on-error: true
        run: python scripts/prioritize_leads.py
      - name: Audit the region and organizer coverage
        run: python scripts/coverage_audit.py
      - name: Rebuild the static page and validate regression suite
        run: |
          python scripts/build_static_page.py
          python -m unittest discover -s tests -v
      - name: Store pilot results on develop only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in app/events.json app/index.html app/collection-report.json app/source-health.json app/quarantine-report.json app/portal-candidates.json app/coverage-audit.json app/review-queue.json app/discovery-candidates.json app/pncp-candidates.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: verified development pilot collection"
            git push origin HEAD:develop
          fi
